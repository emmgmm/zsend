<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZSend</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
    <style>
        /* 全局样式重置 */
        body { margin: 0; background: #f5f7fa; }
        #app { min-height: 100vh; }

        /* 登录页居中布局 */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card { width: 400px; }
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: #303133;
        }

        /* 主布局：侧边栏 + 内容区 */
        .app-layout { min-height: 100vh; }
        .app-aside {
            background: #304156;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .app-aside .el-menu {
            border-right: none;
            flex: 1;
            overflow-y: auto;
        }
        .app-aside .menu-header {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            background: #263445;
            flex-shrink: 0;
        }
        .app-aside .logout-item {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 200px;
            height: 56px;
            border-top: 1px solid #3d4e5f;
            flex: none;
            flex-shrink: 0;
            overflow: hidden;
            z-index: 10;
        }
        .app-aside .logout-item .el-menu-item {
            height: 56px;
            line-height: 56px;
        }
        .app-main { padding: 20px; overflow-y: auto; }

        /* 搜索栏 */
        .search-bar {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        /* 分页栏 */
        .pagination-bar {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        /* 账号管理页工具栏 */
        .toolbar {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .toolbar-actions {
            display: flex;
            gap: 10px;
        }
        .curl-preview {
            margin: 0;
            padding: 12px;
            background: #f5f7fa;
            border: 1px solid #e4e7ed;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 12px;
            line-height: 1.5;
        }
        .account-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .account-actions .el-button {
            margin-left: 0;
        }
        .toolbar-hint {
            color: #909399;
            font-size: 12px;
        }
        .form-hint {
            margin-top: 6px;
            color: #909399;
            font-size: 12px;
            line-height: 1.4;
        }
        .key-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .key-value {
            font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
            font-size: 12px;
            color: #303133;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div id="app">
        <router-view></router-view>
    </div>

    <!-- CDN 依赖：Vue 2 + Vue Router 3 + Element UI -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.16/dist/vue.min.js"></script>
    <script src="https://unpkg.com/vue-router@3.6.5/dist/vue-router.js"></script>
    <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
    <script src="https://unpkg.com/element-ui@2.15.14/lib/umd/locale/en.js"></script>
    <script>
        ELEMENT.locale(ELEMENT.lang.en);

        // ─── 工具函数 ──────────────────────────────────────────

        // 从 sessionStorage 获取认证 token
        function getToken() {
            return sessionStorage.getItem('zsend_token') || '';
        }

        // 通用 API 请求封装，自动携带 token
        function apiRequest(url, options) {
            options = options || {};
            var headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
            var token = getToken();
            if (token) {
                headers['Authorization'] = 'Bearer ' + token;
            }
            return fetch(url, Object.assign({}, options, { headers: headers }))
                .then(function(res) { return res.json(); });
        }

        // 格式化日期时间
        function formatDate(dateStr) {
            if (!dateStr) return '';
            var d = new Date(dateStr);
            var pad = function(n) { return String(n).padStart(2, '0'); };
            return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' '
                 + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
        }

        // ─── 登录组件 ──────────────────────────────────────────

        var LoginView = {
            template: '<div class="login-container">' +
                '<el-card class="login-card">' +
                    '<h2 class="login-title">ZSend</h2>' +
                    '<el-form @submit.native.prevent="handleLogin">' +
                        '<el-form-item label="Username">' +
                            '<el-input' +
                                ' v-model="username"' +
                                ' placeholder="Enter your username"' +
                                ' @keyup.enter.native="handleLogin"' +
                            '></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Password">' +
                            '<el-input' +
                                ' v-model="password"' +
                                ' type="password"' +
                                ' placeholder="Enter your password"' +
                                ' show-password' +
                                ' @keyup.enter.native="handleLogin"' +
                            '></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item>' +
                            '<el-button' +
                                ' type="primary"' +
                                ' :loading="loading"' +
                                ' @click="handleLogin"' +
                                ' style="width: 100%;"' +
                            '>Login</el-button>' +
                        '</el-form-item>' +
                    '</el-form>' +
                '</el-card>' +
            '</div>',
            data: function() {
                return { username: '', password: '', loading: false };
            },
            methods: {
                // 登录：校验用户名密码后保存会话 token 并跳转到日志页
                handleLogin: function() {
                    if (!this.username.trim() || !this.password) {
                        this.$message.warning('Please enter username and password');
                        return;
                    }
                    var self = this;
                    self.loading = true;
                    apiRequest('/api/v1/auth', {
                        method: 'POST',
                        body: JSON.stringify({ username: self.username, password: self.password }),
                    })
                    .then(function(data) {
                        if (data.code === 200 && data.data && data.data.token) {
                            sessionStorage.setItem('zsend_token', data.data.token);
                            self.$message.success('Login successful');
                            self.$router.push('/logs');
                        } else {
                            self.$message.error(data.msg || 'Invalid username or password');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.loading = false;
                    });
                }
            }
        };

        // ─── 邮件日志组件 ──────────────────────────────────────

        var LogsView = {
            template: '<div>' +
                '<el-card>' +
                    '<div slot="header"><strong>Mail Logs</strong></div>' +
                    '<div class="search-bar">' +
                        '<el-input' +
                            ' v-model="searchEmail"' +
                            ' placeholder="Search by email"' +
                            ' clearable' +
                            ' @clear="handleClear"' +
                            ' @keyup.enter.native="fetchLogs"' +
                            ' style="width: 300px;"' +
                        '></el-input>' +
                        '<el-button type="primary" @click="fetchLogs" :loading="loading">Search</el-button>' +
                    '</div>' +
                    '<el-table :data="logs" border stripe style="width: 100%">' +
                        '<el-table-column prop="created_at" label="Time" width="180">' +
                            '<template slot-scope="scope">{{ formatDate(scope.row.created_at) }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="from_email" label="From" width="200" show-overflow-tooltip></el-table-column>' +
                        '<el-table-column prop="to_email" label="To" width="200" show-overflow-tooltip></el-table-column>' +
                        '<el-table-column prop="subject" label="Subject" show-overflow-tooltip></el-table-column>' +
                        '<el-table-column prop="status" label="Status" width="100">' +
                            '<template slot-scope="scope">' +
                                '<el-tag :type="statusType(scope.row.status)" size="small">' +
                                    '{{ scope.row.status }}' +
                                '</el-tag>' +
                            '</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="mail_type" label="Type" width="100"></el-table-column>' +
                        '<el-table-column prop="api_key_name" label="Key" width="160" show-overflow-tooltip>' +
                            '<template slot-scope="scope">{{ scope.row.api_key_name || dash }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="content_text" label="Content" min-width="200">' +
                            '<template slot-scope="scope">' +
                                '<el-tooltip v-if="scope.row.content_text" placement="top" :open-delay="300">' +
                                    '<div slot="content" style="max-width: 400px; word-break: break-all;">{{ scope.row.content_text }}</div>' +
                                    '<span>{{ truncateText(scope.row.content_text) }}</span>' +
                                '</el-tooltip>' +
                            '</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="request_ip" label="IP" width="140"></el-table-column>' +
                    '</el-table>' +
                    '<div class="pagination-bar">' +
                        '<el-pagination' +
                            ' background' +
                            ' layout="total, prev, pager, next, sizes"' +
                            ' :total="total"' +
                            ' :page-size="pageSize"' +
                            ' :current-page.sync="currentPage"' +
                            ' :page-sizes="[10, 20, 50, 100]"' +
                            ' @current-change="handlePageChange"' +
                            ' @size-change="handleSizeChange"' +
                        '></el-pagination>' +
                    '</div>' +
                '</el-card>' +
            '</div>',
            data: function() {
                return {
                    searchEmail: '',
                    logs: [],
                    total: 0,
                    currentPage: 1,
                    pageSize: 20,
                    loading: false,
                    dash: '\u2014',
                };
            },
            mounted: function() {
                this.fetchLogs();
            },
            methods: {
                formatDate: formatDate,
                // 截断文本，超过 50 字符显示省略号
                truncateText: function(text) {
                    if (!text) return '';
                    return text.length > 50 ? text.substring(0, 50) + '...' : text;
                },
                // 根据状态返回标签类型
                statusType: function(status) {
                    return status === 'success' ? 'success' : 'danger';
                },
                // 获取邮件日志列表
                fetchLogs: function() {
                    var self = this;
                    self.loading = true;
                    var params = new URLSearchParams({
                        page: String(self.currentPage),
                        pageSize: String(self.pageSize),
                    });
                    if (self.searchEmail.trim()) {
                        params.set('email', self.searchEmail.trim());
                    }
                    apiRequest('/api/v1/logs?' + params.toString())
                    .then(function(data) {
                        if (data.code === 200) {
                            self.logs = data.data.items;
                            self.total = data.data.total;
                        } else if (data.code === 401) {
                            self.$message.error('Session expired');
                            self.$router.push('/login');
                        } else {
                            self.$message.error(data.msg || 'Failed to fetch logs');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.loading = false;
                    });
                },
                handlePageChange: function(page) {
                    this.currentPage = page;
                    this.fetchLogs();
                },
                handleSizeChange: function(size) {
                    this.pageSize = size;
                    this.currentPage = 1;
                    this.fetchLogs();
                },
                handleClear: function() {
                    this.currentPage = 1;
                    this.fetchLogs();
                }
            }
        };

        // ─── SMTP 账号管理组件 ────────────────────────────────

        var AccountsView = {
            template: '<div>' +
                '<el-card>' +
                    '<div slot="header"><strong>SMTP Accounts</strong></div>' +
                    '<div class="toolbar">' +
                        '<span></span>' +
                        '<div class="toolbar-actions">' +
                            '<el-button type="success" size="small" icon="el-icon-message" @click="openSendDialog">Send Email</el-button>' +
                            '<el-button type="primary" size="small" icon="el-icon-plus" @click="openDialog(null)">Add Account</el-button>' +
                        '</div>' +
                    '</div>' +
                    '<el-table :data="accounts" border stripe style="width: 100%">' +
                        '<el-table-column prop="host" label="Host" width="180" show-overflow-tooltip></el-table-column>' +
                        '<el-table-column prop="port" label="Port" width="80"></el-table-column>' +
                        '<el-table-column prop="username" label="Username" width="200" show-overflow-tooltip></el-table-column>' +
                        '<el-table-column prop="from_email" label="From Email" width="200" show-overflow-tooltip>' +
                            '<template slot-scope="scope">{{ scope.row.from_email || dash }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="sender_name" label="Sender Name" width="150" show-overflow-tooltip>' +
                            '<template slot-scope="scope">{{ scope.row.sender_name || dash }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="protocol" label="Protocol" width="100">' +
                            '<template slot-scope="scope">{{ scope.row.protocol || "STARTTLS" }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Enabled" width="90">' +
                            '<template slot-scope="scope">' +
                                '<el-switch :value="scope.row.enabled === 1" @change="toggleEnabled(scope.row)"></el-switch>' +
                            '</template>' +
                        '</el-table-column>' +
                        '<el-table-column prop="remark" label="Remark" min-width="150" show-overflow-tooltip>' +
                            '<template slot-scope="scope">{{ scope.row.remark || dash }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Actions" width="150" fixed="right">' +
                            '<template slot-scope="scope">' +
                                '<div class="account-actions">' +
                                    '<el-tooltip content="API Example" placement="top">' +
                                        '<el-button type="text" size="small" icon="el-icon-document-copy" @click="openApiDialog(scope.row)"></el-button>' +
                                    '</el-tooltip>' +
                                    '<el-tooltip content="Edit" placement="top">' +
                                        '<el-button type="text" size="small" icon="el-icon-edit" @click="openDialog(scope.row)"></el-button>' +
                                    '</el-tooltip>' +
                                    '<el-popconfirm title="Delete this account?" @confirm="handleDelete(scope.row.id)">' +
                                        '<el-button type="text" size="small" icon="el-icon-delete" style="color: #f56c6c;" slot="reference"></el-button>' +
                                    '</el-popconfirm>' +
                                '</div>' +
                            '</template>' +
                        '</el-table-column>' +
                    '</el-table>' +
                    '<div class="pagination-bar">' +
                        '<el-pagination' +
                            ' background' +
                            ' layout="total, prev, pager, next"' +
                            ' :total="total"' +
                            ' :page-size="pageSize"' +
                            ' :current-page.sync="currentPage"' +
                            ' @current-change="handlePageChange"' +
                        '></el-pagination>' +
                    '</div>' +
                '</el-card>' +

                <!-- 新增/编辑弹窗 -->
                '<el-dialog' +
                    ' :title="dialogTitle"' +
                    ' :visible.sync="dialogVisible"' +
                    ' width="520px"' +
                    ' :close-on-click-modal="false"' +
                '>' +
                    '<el-form :model="form" label-width="110px" size="small">' +
                        '<el-form-item label="Host" required>' +
                            '<el-input v-model="form.host" placeholder="smtp.example.com"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Port" required>' +
                            '<el-input-number v-model="form.port" :min="1" :max="65535" style="width: 100%;"></el-input-number>' +
                        '</el-form-item>' +
                        '<el-form-item label="Username" required>' +
                            '<el-input v-model="form.username" placeholder="user@example.com"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Password" required>' +
                            '<el-input v-model="form.password" type="password" show-password placeholder="SMTP password"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="From Email">' +
                            '<el-input v-model="form.fromEmail" placeholder="Leave empty to use username"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Sender Name">' +
                            '<el-input v-model="form.senderName" placeholder="Display name"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Protocol">' +
                            '<el-select v-model="form.protocol" style="width: 100%;">' +
                                '<el-option label="STARTTLS (default)" value=""></el-option>' +
                                '<el-option label="SSL (port 465)" value="ssl"></el-option>' +
                            '</el-select>' +
                        '</el-form-item>' +
                        '<el-form-item label="Enabled">' +
                            '<el-switch v-model="form.enabled"></el-switch>' +
                        '</el-form-item>' +
                        '<el-form-item label="Remark">' +
                            '<el-input v-model="form.remark" type="textarea" :rows="2" placeholder="Optional note"></el-input>' +
                        '</el-form-item>' +
                    '</el-form>' +
                    '<span slot="footer">' +
                        '<el-button @click="dialogVisible = false">Cancel</el-button>' +
                        '<el-button type="primary" :loading="saving" @click="handleSave">Save</el-button>' +
                    '</span>' +
                '</el-dialog>' +

                <!-- 发送邮件弹窗 -->
                '<el-dialog' +
                    ' title="Send Email"' +
                    ' :visible.sync="sendDialogVisible"' +
                    ' width="560px"' +
                    ' :close-on-click-modal="false"' +
                '>' +
                    '<el-form :model="sendForm" label-width="100px" size="small">' +
                        '<el-form-item label="Title" required>' +
                            '<el-input v-model="sendForm.title" placeholder="Email subject"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="From" required>' +
                            '<el-select v-model="sendForm.from" placeholder="Select SMTP username" style="width: 100%;">' +
                                '<el-option' +
                                    ' v-for="account in accounts"' +
                                    ' :key="account.id"' +
                                    ' :label="account.username"' +
                                    ' :value="account.username"' +
                                '></el-option>' +
                            '</el-select>' +
                        '</el-form-item>' +
                        '<el-form-item label="To" required>' +
                            '<el-input v-model="sendForm.to" placeholder="recipient@example.com, another@example.com"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Type" required>' +
                            '<el-select v-model="sendForm.type" style="width: 100%;">' +
                                '<el-option label="text" value="text"></el-option>' +
                                '<el-option label="html" value="html"></el-option>' +
                                '<el-option label="markdown" value="markdown"></el-option>' +
                            '</el-select>' +
                        '</el-form-item>' +
                        '<el-form-item label="Content" required>' +
                            '<el-input v-model="sendForm.content" type="textarea" :rows="6" placeholder="Email content"></el-input>' +
                        '</el-form-item>' +
                    '</el-form>' +
                    '<span slot="footer">' +
                        '<el-button @click="sendDialogVisible = false">Cancel</el-button>' +
                        '<el-button type="primary" :loading="sending" @click="handleSendEmail">Send</el-button>' +
                    '</span>' +
                '</el-dialog>' +

                <!-- API 示例弹窗 -->
                '<el-dialog' +
                    ' title="API Example"' +
                    ' :visible.sync="apiDialogVisible"' +
                    ' width="720px"' +
                    ' :close-on-click-modal="false"' +
                '>' +
                    '<pre class="curl-preview">{{ apiCurl }}</pre>' +
                    '<span slot="footer">' +
                        '<el-button @click="apiDialogVisible = false">Close</el-button>' +
                        '<el-button type="primary" icon="el-icon-document-copy" @click="copyApiCurl">Copy</el-button>' +
                    '</span>' +
                '</el-dialog>' +
            '</div>',
            data: function() {
                return {
                    accounts: [],
                    total: 0,
                    currentPage: 1,
                    pageSize: 20,
                    loading: false,
                    dialogVisible: false,
                    sendDialogVisible: false,
                    apiDialogVisible: false,
                    saving: false,
                    sending: false,
                    apiCurl: '',
                    dash: '\u2014',
                    // 表单数据，id 为空表示新增
                    form: {
                        id: '',
                        host: '',
                        port: 587,
                        username: '',
                        password: '',
                        fromEmail: '',
                        senderName: '',
                        protocol: '',
                        enabled: true,
                        remark: '',
                    },
                    sendForm: {
                        title: '',
                        from: '',
                        to: '',
                        type: 'markdown',
                        content: '',
                    },
                };
            },
            mounted: function() {
                this.fetchAccounts();
            },
            computed: {
                dialogTitle: function() {
                    return this.form.id ? 'Edit Account' : 'Add Account';
                }
            },
            methods: {
                // 获取账号列表
                fetchAccounts: function() {
                    var self = this;
                    self.loading = true;
                    var params = new URLSearchParams({
                        page: String(self.currentPage),
                        pageSize: String(self.pageSize),
                    });
                    apiRequest('/api/v1/accounts?' + params.toString())
                    .then(function(data) {
                        if (data.code === 200) {
                            self.accounts = data.data.items;
                            self.total = data.data.total;
                        } else if (data.code === 401) {
                            self.$message.error('Session expired');
                            self.$router.push('/login');
                        } else {
                            self.$message.error(data.msg || 'Failed to fetch accounts');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.loading = false;
                    });
                },

                // 打开新增/编辑弹窗；account 为 null 时是新增
                openDialog: function(account) {
                    if (account) {
                        this.form = {
                            id: account.id,
                            host: account.host,
                            port: account.port,
                            username: account.username,
                            password: account.password,
                            fromEmail: account.from_email || '',
                            senderName: account.sender_name || '',
                            protocol: account.protocol || '',
                            enabled: account.enabled === 1,
                            remark: account.remark || '',
                        };
                    } else {
                        this.form = {
                            id: '',
                            host: '',
                            port: 587,
                            username: '',
                            password: '',
                            fromEmail: '',
                            senderName: '',
                            protocol: '',
                            enabled: true,
                            remark: '',
                        };
                    }
                    this.dialogVisible = true;
                },

                // 保存（新增或更新）
                handleSave: function() {
                    var self = this;
                    // 基础前端校验
                    if (!self.form.host || !self.form.port || !self.form.username || !self.form.password) {
                        self.$message.warning('Please fill in all required fields');
                        return;
                    }
                    self.saving = true;

                    var payload = {
                        host: self.form.host,
                        port: self.form.port,
                        username: self.form.username,
                        password: self.form.password,
                        fromEmail: self.form.fromEmail || null,
                        senderName: self.form.senderName || null,
                        protocol: self.form.protocol || null,
                        enabled: self.form.enabled ? 1 : 0,
                        remark: self.form.remark || null,
                    };

                    var url = '/api/v1/accounts';
                    var method = 'POST';
                    if (self.form.id) {
                        url = '/api/v1/accounts/' + self.form.id;
                        method = 'PUT';
                    }

                    apiRequest(url, { method: method, body: JSON.stringify(payload) })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success(self.form.id ? 'Account updated' : 'Account created');
                            self.dialogVisible = false;
                            self.fetchAccounts();
                        } else {
                            self.$message.error(data.msg || 'Operation failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.saving = false;
                    });
                },

                // 删除账号
                handleDelete: function(id) {
                    var self = this;
                    apiRequest('/api/v1/accounts/' + id, { method: 'DELETE' })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success('Account deleted');
                            self.fetchAccounts();
                        } else {
                            self.$message.error(data.msg || 'Delete failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    });
                },

                // 切换启用/禁用状态
                toggleEnabled: function(row) {
                    var self = this;
                    var newEnabled = row.enabled === 1 ? 0 : 1;
                    apiRequest('/api/v1/accounts/' + row.id, {
                        method: 'PUT',
                        body: JSON.stringify({ enabled: newEnabled }),
                    })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success(newEnabled ? 'Account enabled' : 'Account disabled');
                            self.fetchAccounts();
                        } else {
                            self.$message.error(data.msg || 'Update failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    });
                },

                openSendDialog: function() {
                    this.sendForm = {
                        title: '',
                        from: this.accounts.length ? this.accounts[0].username : '',
                        to: '',
                        type: 'markdown',
                        content: '',
                    };
                    this.sendDialogVisible = true;
                },

                handleSendEmail: function() {
                    var self = this;
                    if (!self.sendForm.title || !self.sendForm.from || !self.sendForm.content) {
                        self.$message.warning('Please fill in all required fields');
                        return;
                    }

                    var recipients = self.sendForm.to.split(',')
                        .map(function(email) { return email.trim(); })
                        .filter(Boolean);

                    recipients = Array.from(new Set(recipients));
                    if (recipients.length === 0) {
                        self.$message.warning('Please enter at least one recipient');
                        return;
                    }

                    self.sending = true;
                    apiRequest('/api/v1/send', {
                        method: 'POST',
                        body: JSON.stringify({
                            from: self.sendForm.from,
                            to: recipients.length === 1 ? recipients[0] : recipients,
                            title: self.sendForm.title,
                            content: self.sendForm.content,
                            type: self.sendForm.type,
                        }),
                    })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success('Email request accepted');
                            self.sendDialogVisible = false;
                        } else if (data.code === 401) {
                            self.$message.error('Session expired');
                            self.$router.push('/login');
                        } else {
                            self.$message.error(data.msg || 'Send failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.sending = false;
                    });
                },

                openApiDialog: function(row) {
                    var payload = {
                        from: row.username,
                        to: 'recipient@example.com',
                        title: 'Welcome to ZSend',
                        content: '# Hello\nThis email was sent by ZSend.',
                        type: 'markdown',
                        sender_name: row.sender_name || 'ZSend Notifications',
                    };
                    this.apiCurl = [
                        'curl -X POST "' + window.location.origin + '/api/v1/send" \\',
                        '  -H "Authorization: Bearer <YOUR_API_KEY>" \\',
                        '  -H "Content-Type: application/json" \\',
                        "  -d '" + JSON.stringify(payload, null, 2) + "'",
                    ].join('\n');
                    this.apiDialogVisible = true;
                },

                copyApiCurl: function() {
                    var self = this;
                    var copyText = function() {
                        var textarea = document.createElement('textarea');
                        textarea.value = self.apiCurl;
                        textarea.setAttribute('readonly', 'readonly');
                        textarea.style.position = 'fixed';
                        textarea.style.opacity = '0';
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        self.$message.success('Copied');
                    };

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(self.apiCurl)
                            .then(function() {
                                self.$message.success('Copied');
                            })
                            .catch(copyText);
                    } else {
                        copyText();
                    }
                },

                handlePageChange: function(page) {
                    this.currentPage = page;
                    this.fetchAccounts();
                },
            }
        };

        // ─── 发信密钥管理组件 ──────────────────────────────────

        var KeysView = {
            template: '<div>' +
                '<el-card>' +
                    '<div slot="header"><strong>API Keys</strong></div>' +
                    '<div class="toolbar">' +
                        '<span class="toolbar-hint">Used as the Bearer token for POST /api/v1/send</span>' +
                        '<div class="toolbar-actions">' +
                            '<el-button type="primary" size="small" icon="el-icon-plus" @click="openDialog(null)">Add Key</el-button>' +
                        '</div>' +
                    '</div>' +
                    '<el-table :data="keys" border stripe style="width: 100%">' +
                        '<el-table-column prop="name" label="Name" width="180" show-overflow-tooltip>' +
                            '<template slot-scope="scope">{{ scope.row.name || dash }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Key" min-width="300">' +
                            '<template slot-scope="scope">' +
                                '<div class="key-cell">' +
                                    '<code class="key-value">{{ revealed[scope.row.id] || scope.row.key_masked }}</code>' +
                                    '<el-tooltip content="View" placement="top">' +
                                        '<el-button type="text" size="small" icon="el-icon-view" @click="requestReveal(scope.row)"></el-button>' +
                                    '</el-tooltip>' +
                                    '<el-tooltip content="Copy" placement="top">' +
                                        '<el-button type="text" size="small" icon="el-icon-document-copy" @click="requestCopy(scope.row)"></el-button>' +
                                    '</el-tooltip>' +
                                '</div>' +
                            '</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Enabled" width="90">' +
                            '<template slot-scope="scope">' +
                                '<el-switch :value="scope.row.enabled === 1" @change="toggleEnabled(scope.row)"></el-switch>' +
                            '</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Last Used" width="180">' +
                            '<template slot-scope="scope">{{ scope.row.last_used_at ? formatDate(scope.row.last_used_at) : dash }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Created" width="180">' +
                            '<template slot-scope="scope">{{ formatDate(scope.row.created_at) }}</template>' +
                        '</el-table-column>' +
                        '<el-table-column label="Actions" width="150" fixed="right">' +
                            '<template slot-scope="scope">' +
                                '<div class="account-actions">' +
                                    '<el-tooltip content="Edit" placement="top">' +
                                        '<el-button type="text" size="small" icon="el-icon-edit" @click="openDialog(scope.row)"></el-button>' +
                                    '</el-tooltip>' +
                                    '<el-popconfirm title="Delete this key?" @confirm="handleDelete(scope.row.id)">' +
                                        '<el-button type="text" size="small" icon="el-icon-delete" style="color: #f56c6c;" slot="reference"></el-button>' +
                                    '</el-popconfirm>' +
                                '</div>' +
                            '</template>' +
                        '</el-table-column>' +
                    '</el-table>' +
                '</el-card>' +

                '<el-dialog' +
                    ' :title="dialogTitle"' +
                    ' :visible.sync="dialogVisible"' +
                    ' width="520px"' +
                    ' :close-on-click-modal="false"' +
                '>' +
                    '<el-form :model="form" label-width="110px" size="small">' +
                        '<el-form-item label="Name">' +
                            '<el-input v-model="form.name" placeholder="e.g. Production"></el-input>' +
                        '</el-form-item>' +
                        '<el-form-item label="Key">' +
                            '<el-input v-model="form.key" placeholder="Leave empty to auto-generate"></el-input>' +
                            '<div class="form-hint">{{ form.id ? "Leave empty to keep the current key. Enter a new value to replace it." : "Leave empty to auto-generate a sk- key, or paste an existing key." }}</div>' +
                        '</el-form-item>' +
                        '<el-form-item label="Enabled">' +
                            '<el-switch v-model="form.enabled"></el-switch>' +
                        '</el-form-item>' +
                    '</el-form>' +
                    '<span slot="footer">' +
                        '<el-button @click="dialogVisible = false">Cancel</el-button>' +
                        '<el-button type="primary" :loading="saving" @click="handleSave">Save</el-button>' +
                    '</span>' +
                '</el-dialog>' +

                '<el-dialog' +
                    ' title="Confirm Password"' +
                    ' :visible.sync="revealDialogVisible"' +
                    ' width="420px"' +
                    ' :close-on-click-modal="false"' +
                    ' @closed="onRevealDialogClosed"' +
                '>' +
                    '<el-form @submit.native.prevent="confirmReveal">' +
                        '<el-form-item>' +
                            '<el-input' +
                                ' v-model="revealPassword"' +
                                ' type="password"' +
                                ' show-password' +
                                ' placeholder="Enter admin password"' +
                                ' @keyup.enter.native="confirmReveal"' +
                            '></el-input>' +
                        '</el-form-item>' +
                    '</el-form>' +
                    '<span slot="footer">' +
                        '<el-button @click="revealDialogVisible = false">Cancel</el-button>' +
                        '<el-button type="primary" :loading="revealing" @click="confirmReveal">Confirm</el-button>' +
                    '</span>' +
                '</el-dialog>' +

                '<el-dialog' +
                    ' title="API Key"' +
                    ' :visible.sync="keyDialogVisible"' +
                    ' width="520px"' +
                    ' :close-on-click-modal="false"' +
                '>' +
                    '<div class="form-hint" style="margin-top: 0; margin-bottom: 10px;">{{ keyDialogHint }}</div>' +
                    '<pre class="curl-preview">{{ keyDialogValue }}</pre>' +
                    '<span slot="footer">' +
                        '<el-button @click="keyDialogVisible = false">Close</el-button>' +
                        '<el-button type="primary" icon="el-icon-document-copy" @click="copyText(keyDialogValue)">Copy</el-button>' +
                    '</span>' +
                '</el-dialog>' +
            '</div>',
            data: function() {
                return {
                    keys: [],
                    loading: false,
                    dialogVisible: false,
                    saving: false,
                    dash: '\u2014',
                    // 已解锁的完整 key 缓存（仅内存，刷新即失效）
                    revealed: {},
                    revealDialogVisible: false,
                    revealPassword: '',
                    revealing: false,
                    revealTarget: null,
                    revealAction: 'view',
                    keyDialogVisible: false,
                    keyDialogValue: '',
                    keyDialogHint: '',
                    form: {
                        id: '',
                        name: '',
                        key: '',
                        enabled: true,
                    },
                };
            },
            mounted: function() {
                this.fetchKeys();
            },
            computed: {
                dialogTitle: function() {
                    return this.form.id ? 'Edit Key' : 'Add Key';
                }
            },
            methods: {
                formatDate: formatDate,

                fetchKeys: function() {
                    var self = this;
                    self.loading = true;
                    apiRequest('/api/v1/keys')
                    .then(function(data) {
                        if (data.code === 200) {
                            self.keys = data.data.items;
                        } else if (data.code === 401) {
                            self.$message.error('Session expired');
                            self.$router.push('/login');
                        } else {
                            self.$message.error(data.msg || 'Failed to fetch keys');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.loading = false;
                    });
                },

                openDialog: function(row) {
                    if (row) {
                        this.form = {
                            id: row.id,
                            name: row.name || '',
                            // 不再回填完整 key，留空表示保持原值
                            key: '',
                            enabled: row.enabled === 1,
                        };
                    } else {
                        this.form = {
                            id: '',
                            name: '',
                            key: '',
                            enabled: true,
                        };
                    }
                    this.dialogVisible = true;
                },

                handleSave: function() {
                    var self = this;
                    self.saving = true;

                    var payload = {
                        name: self.form.name || null,
                        enabled: self.form.enabled ? 1 : 0,
                    };

                    // 新增时 key 可留空由后端自动生成；编辑时传空表示不修改
                    if (!self.form.id || self.form.key) {
                        payload.key = self.form.key || null;
                    }

                    var url = '/api/v1/keys';
                    var method = 'POST';
                    if (self.form.id) {
                        url = '/api/v1/keys/' + self.form.id;
                        method = 'PUT';
                    }

                    apiRequest(url, { method: method, body: JSON.stringify(payload) })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success(self.form.id ? 'Key updated' : 'Key created');
                            self.dialogVisible = false;
                            // 新建时接口是唯一返回完整 key 的时机，弹窗让用户先复制
                            if (!self.form.id && data.data && data.data.key) {
                                self.keyDialogValue = data.data.key;
                                self.keyDialogHint = 'Copy this key now. Use the View button to see it again (requires your admin password).';
                                self.keyDialogVisible = true;
                                self.revealed[data.data.id] = data.data.key;
                            }
                            self.fetchKeys();
                        } else {
                            self.$message.error(data.msg || 'Operation failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.saving = false;
                    });
                },

                handleDelete: function(id) {
                    var self = this;
                    apiRequest('/api/v1/keys/' + id, { method: 'DELETE' })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success('Key deleted');
                            self.fetchKeys();
                        } else {
                            self.$message.error(data.msg || 'Delete failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    });
                },

                toggleEnabled: function(row) {
                    var self = this;
                    var newEnabled = row.enabled === 1 ? 0 : 1;
                    apiRequest('/api/v1/keys/' + row.id, {
                        method: 'PUT',
                        body: JSON.stringify({ enabled: newEnabled }),
                    })
                    .then(function(data) {
                        if (data.code === 200) {
                            self.$message.success(newEnabled ? 'Key enabled' : 'Key disabled');
                            self.fetchKeys();
                        } else {
                            self.$message.error(data.msg || 'Update failed');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    });
                },

                // 点击查看：已解锁则直接展示，否则先弹密码框
                requestReveal: function(row) {
                    var self = this;
                    if (self.revealed[row.id]) {
                        self.keyDialogValue = self.revealed[row.id];
                        self.keyDialogHint = 'Full API key';
                        self.keyDialogVisible = true;
                        return;
                    }
                    self.openRevealDialog(row, 'view');
                },

                // 点击复制：已解锁则直接复制，否则先弹密码框
                requestCopy: function(row) {
                    var self = this;
                    if (self.revealed[row.id]) {
                        self.copyText(self.revealed[row.id]);
                        return;
                    }
                    self.openRevealDialog(row, 'copy');
                },

                openRevealDialog: function(row, action) {
                    this.revealTarget = row;
                    this.revealAction = action;
                    this.revealPassword = '';
                    this.revealDialogVisible = true;
                },

                onRevealDialogClosed: function() {
                    this.revealPassword = '';
                    this.revealTarget = null;
                },

                // 校验管理员密码，通过后按需展示或复制完整 key
                confirmReveal: function() {
                    var self = this;
                    if (!self.revealTarget) return;
                    if (!self.revealPassword) {
                        self.$message.warning('Please enter your admin password');
                        return;
                    }
                    self.revealing = true;
                    apiRequest('/api/v1/keys/' + self.revealTarget.id + '/reveal', {
                        method: 'POST',
                        body: JSON.stringify({ password: self.revealPassword }),
                    })
                    .then(function(data) {
                        if (data.code === 200) {
                            var key = data.data.key;
                            self.revealed[self.revealTarget.id] = key;
                            self.revealDialogVisible = false;
                            if (self.revealAction === 'copy') {
                                self.copyText(key);
                            } else {
                                self.keyDialogValue = key;
                                self.keyDialogHint = 'Full API key';
                                self.keyDialogVisible = true;
                            }
                        } else if (data.code === 401) {
                            self.$message.error(data.msg || 'Invalid password');
                        } else {
                            self.$message.error(data.msg || 'Failed to reveal key');
                        }
                    })
                    .catch(function() {
                        self.$message.error('Network error');
                    })
                    .finally(function() {
                        self.revealing = false;
                    });
                },

                // 通用复制到剪贴板
                copyText: function(text) {
                    var self = this;
                    var fallback = function() {
                        var textarea = document.createElement('textarea');
                        textarea.value = text;
                        textarea.setAttribute('readonly', 'readonly');
                        textarea.style.position = 'fixed';
                        textarea.style.opacity = '0';
                        document.body.appendChild(textarea);
                        textarea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textarea);
                        self.$message.success('Copied');
                    };

                    if (navigator.clipboard && navigator.clipboard.writeText) {
                        navigator.clipboard.writeText(text)
                            .then(function() { self.$message.success('Copied'); })
                            .catch(fallback);
                    } else {
                        fallback();
                    }
                },
            }
        };

        // ─── 带侧边栏的布局壳组件 ─────────────────────────────

        var AppLayout = {
            template: '<el-container class="app-layout">' +
                '<el-aside width="200px" class="app-aside">' +
                    '<div class="menu-header">ZSend</div>' +
                    '<el-menu' +
                        ' :default-active="activeMenu"' +
                        ' :router="true"' +
                        ' background-color="#304156"' +
                        ' text-color="#bfcbd9"' +
                        ' active-text-color="#409EFF"' +
                    '>' +
                        '<el-menu-item index="/logs">' +
                            '<i class="el-icon-document"></i>' +
                            '<span>Mail Logs</span>' +
                        '</el-menu-item>' +
                        '<el-menu-item index="/accounts">' +
                            '<i class="el-icon-setting"></i>' +
                            '<span>SMTP Accounts</span>' +
                        '</el-menu-item>' +
                        '<el-menu-item index="/keys">' +
                            '<i class="el-icon-key"></i>' +
                            '<span>API Keys</span>' +
                        '</el-menu-item>' +
                    '</el-menu>' +
                    '<el-menu' +
                        ' background-color="#304156"' +
                        ' text-color="#bfcbd9"' +
                        ' active-text-color="#409EFF"' +
                        ' class="logout-item"' +
                    '>' +
                        '<el-menu-item @click="handleLogout">' +
                            '<i class="el-icon-switch-button"></i>' +
                            '<span>Logout</span>' +
                        '</el-menu-item>' +
                    '</el-menu>' +
                '</el-aside>' +
                '<el-main class="app-main">' +
                    '<router-view></router-view>' +
                '</el-main>' +
            '</el-container>',
            computed: {
                activeMenu: function() {
                    return this.$route.path;
                }
            },
            methods: {
                // 退出登录：通知服务端销毁会话并清除本地 token
                handleLogout: function() {
                    var self = this;
                    apiRequest('/api/v1/logout', { method: 'POST' })
                    .catch(function() { /* 退出失败也照常清理本地状态 */ })
                    .finally(function() {
                        sessionStorage.removeItem('zsend_token');
                        self.$router.push('/login');
                    });
                }
            }
        };

        // ─── 路由配置 ──────────────────────────────────────────

        var routes = [
            { path: '/login', component: LoginView },
            {
                path: '/',
                component: AppLayout,
                children: [
                    { path: '', redirect: '/logs' },
                    { path: 'logs', component: LogsView },
                    { path: 'accounts', component: AccountsView },
                    { path: 'keys', component: KeysView },
                ],
            },
            { path: '*', redirect: '/logs' },
        ];

        var router = new VueRouter({
            routes: routes,
        });

        // 全局路由守卫：未登录时重定向到登录页
        router.beforeEach(function(to, from, next) {
            if (to.path !== '/login' && !getToken()) {
                next('/login');
            } else if (to.path === '/login' && getToken()) {
                next('/logs');
            } else {
                next();
            }
        });

        // ─── 启动 Vue 实例 ────────────────────────────────────

        new Vue({
            el: '#app',
            router: router,
        });
    </script>
</body>
</html>
